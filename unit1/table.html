<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Table</title>

    <style>
        caption {
            border: 1px solid black;
            padding: 10px;
            color: black;
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <table border="1" bordercolor="black" cellspacing="0" cellpadding="10" padding="10" width="50%" height="50.%">

        <caption>My Table</caption>

        <tr bgcolor="lightblue">
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
            <th>Number</th>
        </tr>

        <tr bgcolor="lightgreen">
            <td rowspan="2">Khushi</td>
            <td rowspan="2">Singh</td>
            <td rowspan="2">21</td>
            <td>1234567890</td>
        </tr>

        <tr bgcolor="lightgreen">
            <td>8585946722</td>
        </tr>

        <tr bgcolor="lightyellow">
            <td rowspan="2">Mansi</td>
            <td rowspan="2">Sharma</td>
            <td rowspan="2">22</td>
            <td>0987654321</td>
        </tr>

        <tr bgcolor="lightyellow">
            <td>8585946722</td>
        </tr>

        <tr bgcolor="lightgray">
            <td rowspan="2">Mehak</td>
            <td rowspan="2">Thakur</td>
            <td rowspan="2">22</td>
            <td>1122334455</td>
        </tr>

        <tr bgcolor="lightgray">
            <td>8585946722</td>
        </tr>

    </table>

</body>
</html>
